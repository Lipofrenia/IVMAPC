{% extends 'base.html' %}
{% load static %}

{% block title %}IVMAPC | Восстановление пароля{% endblock %}

{% block page_css %}
  <link rel="stylesheet" href="{% static 'css/authorization.css' %}" />
{% endblock %}

{% block content %}
  <div class="background">
    <main>
      <form class="form form--auth-alt" method="post" action="{% url 'shop:forgot_password' %}">
        {% csrf_token %}
        <h1>Забыли пароль?</h1>
        <p class="form-lead">
          Укажите e-mail — отправим ссылку для сброса пароля
        </p>
        <div class="input">
          <input
            type="email"
            name="email"
            autocomplete="username"
            placeholder="Электронная почта"
            required />
        </div>
        <button type="submit" class="authorize">Отправить</button>
        <div class="register register--center">
          <a href="{% url 'shop:login' %}">Вернуться ко входу</a>
        </div>
      </form>
    </main>
  </div>
{% endblock %}
