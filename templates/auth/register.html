{% extends 'base.html' %}
{% load static %}

{% block title %}IVMAPC | Регистрация{% endblock %}

{% block page_css %}
  <link rel="stylesheet" href="{% static 'css/authorization.css' %}" />
{% endblock %}

{% block content %}
  <div class="background">
    <main>
      <form class="form form--auth-alt" method="post" action="{% url 'shop:register' %}">
        {% csrf_token %}
        <h1>Регистрация</h1>
        <p class="form-lead">
          Создайте аккаунт, чтобы совершать и отслеживать заказы
        </p>
        <div class="input">
          <input
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Электронная почта"
            required />
        </div>
        <div class="input">
          <input
            type="password"
            name="password"
            autocomplete="new-password"
            placeholder="Пароль"
            minlength="6"
            required />
        </div>
        <div class="input">
          <input
            type="password"
            name="password_confirm"
            autocomplete="new-password"
            placeholder="Подтвердите пароль"
            minlength="6"
            required />
        </div>
        <button type="submit" class="authorize">Зарегистрироваться</button>
        <div class="register register--center">
          <a href="{% url 'shop:login' %}">Уже есть аккаунт? Войти</a>
        </div>
      </form>
    </main>
  </div>
{% endblock %}
